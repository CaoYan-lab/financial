openapi: 3.1.0
info:
  title: 长富管理端 API
  version: 1.0.0
  description: 内部管理 Web 使用的同源 API。浏览器不得直接连接 PostgreSQL。
servers:
  - url: https://admin.example.invalid
security:
  - adminSession: []
paths:
  /api/v1/admin/health:
    get:
      security: []
      operationId: getAdminHealth
      responses:
        "200":
          description: 进程健康
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok, service, version, configured]
                properties:
                  ok: { type: boolean }
                  service: { const: changfu-admin }
                  version: { type: string }
                  configured: { type: boolean }
  /api/v1/admin/ready:
    get:
      security: []
      operationId: getAdminReadiness
      responses:
        "200":
          description: 数据库可用
        "503":
          description: 数据库不可用
  /api/v1/admin/auth/login:
    post:
      security: []
      operationId: loginAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username: { type: string, minLength: 3, maxLength: 80 }
                password: { type: string, minLength: 1, maxLength: 256 }
      responses:
        "200":
          description: 登录成功并设置 HttpOnly 会话 Cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLoginSession"
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /api/v1/admin/auth/session:
    get:
      operationId: getAdminSession
      responses:
        "200":
          description: 当前管理员会话
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401": { $ref: "#/components/responses/Problem" }
  /api/v1/admin/auth/password:
    post:
      operationId: changeAdminPassword
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [currentPassword, nextPassword]
              properties:
                currentPassword: { type: string, minLength: 1, maxLength: 256 }
                nextPassword: { type: string, minLength: 12, maxLength: 256 }
      responses:
        "200": { $ref: "#/components/responses/Updated" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /api/v1/admin/auth/logout:
    post:
      operationId: logoutAdmin
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: 会话已撤销
        "401": { $ref: "#/components/responses/Problem" }
  /api/v1/admin/users:
    get:
      operationId: listManagedUsers
      parameters:
        - name: query
          in: query
          schema: { type: string, maxLength: 100 }
        - name: status
          in: query
          schema: { enum: [all, active, disabled], default: all }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: 分页用户列表
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, page, pageSize, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "../schemas/admin-user.schema.json"
                  total: { type: integer, minimum: 0 }
                  page: { type: integer, minimum: 1 }
                  pageSize: { type: integer, minimum: 1, maximum: 100 }
    post:
      operationId: createManagedUser
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/admin-user.schema.json#/$defs/createRequest"
      responses:
        "201":
          description: 用户已创建
          content:
            application/json:
              schema:
                $ref: "../schemas/admin-user.schema.json"
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/admin/users/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      operationId: getManagedUser
      responses:
        "200":
          description: 用户、券商连接和当前订阅详情
          content:
            application/json:
              schema:
                $ref: "../schemas/admin-user.schema.json"
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateManagedUser
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/admin-user.schema.json#/$defs/updateRequest"
      responses:
        "200": { description: 用户已更新 }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/admin/users/{userId}/reset-password:
    post:
      operationId: resetManagedUserPassword
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/admin-user.schema.json#/$defs/resetPasswordRequest"
      responses:
        "200": { $ref: "#/components/responses/Updated" }
        "400": { $ref: "#/components/responses/Problem" }
  /api/v1/admin/users/{userId}/disable:
    post:
      operationId: disableManagedUser
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { $ref: "#/components/responses/Updated" }
  /api/v1/admin/users/{userId}/enable:
    post:
      operationId: enableManagedUser
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { $ref: "#/components/responses/Updated" }
  /api/v1/admin/users/{userId}/subscription:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      operationId: getManagedSubscription
      responses:
        "200":
          description: 当前订阅
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [subscription]
                properties:
                  subscription:
                    oneOf:
                      - $ref: "../schemas/admin-subscription.schema.json"
                      - type: "null"
    patch:
      operationId: adjustManagedSubscription
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/admin-subscription.schema.json#/$defs/grantRequest"
      responses:
        "200":
          description: 订阅已调整
          content:
            application/json:
              schema:
                $ref: "../schemas/admin-subscription.schema.json"
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/admin/users/{userId}/subscription-grants:
    post:
      operationId: grantManagedSubscription
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/admin-subscription.schema.json#/$defs/grantRequest"
      responses:
        "201":
          description: 订阅已授予
          content:
            application/json:
              schema:
                $ref: "../schemas/admin-subscription.schema.json"
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/admin/users/{userId}/subscription/{action}:
    post:
      operationId: setManagedSubscriptionStatus
      parameters:
        - $ref: "#/components/parameters/UserId"
        - name: action
          in: path
          required: true
          schema: { enum: [freeze, restore, cancel] }
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/admin-subscription.schema.json#/$defs/statusRequest"
      responses:
        "200":
          description: 订阅状态已更新
          content:
            application/json:
              schema:
                $ref: "../schemas/admin-subscription.schema.json"
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/admin/users/{userId}/subscription/slots:
    put:
      operationId: updateManagedSubscriptionSlots
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/admin-subscription.schema.json#/$defs/slotUpdateRequest"
      responses:
        "200":
          description: 槽位已更新
          content:
            application/json:
              schema:
                $ref: "../schemas/admin-subscription.schema.json"
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/admin/users/{userId}/subscription/history:
    get:
      operationId: getManagedSubscriptionHistory
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: 人工授予和订阅事件审计历史
  /api/v1/admin/plans:
    get:
      operationId: listAdminPlans
      responses:
        "200":
          description: 三档套餐的全部版本
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [LITE, PRO, FLAGSHIP]
                properties:
                  LITE: { $ref: "#/components/schemas/PlanVersions" }
                  PRO: { $ref: "#/components/schemas/PlanVersions" }
                  FLAGSHIP: { $ref: "#/components/schemas/PlanVersions" }
  /api/v1/admin/plans/{planCode}/versions:
    parameters:
      - $ref: "#/components/parameters/PlanCode"
    get:
      operationId: listAdminPlanVersions
      responses:
        "200":
          description: 指定套餐版本
    post:
      operationId: createAdminPlanDraft
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: 草稿已从现有版本复制
          content:
            application/json:
              schema:
                $ref: "../schemas/admin-plan.schema.json"
  /api/v1/admin/plans/{planCode}/versions/{versionId}:
    put:
      operationId: updateAdminPlanDraft
      parameters:
        - $ref: "#/components/parameters/PlanCode"
        - $ref: "#/components/parameters/VersionId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/admin-plan.schema.json#/$defs/input"
      responses:
        "200":
          description: 草稿已更新
          content:
            application/json:
              schema:
                $ref: "../schemas/admin-plan.schema.json"
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/admin/plans/{planCode}/versions/{versionId}/{action}:
    post:
      operationId: setAdminPlanVersionStatus
      parameters:
        - $ref: "#/components/parameters/PlanCode"
        - $ref: "#/components/parameters/VersionId"
        - name: action
          in: path
          required: true
          schema: { enum: [publish, retire] }
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { $ref: "#/components/responses/Updated" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/admin/official-model:
    get:
      operationId: listOfficialModelVersions
      responses:
        "200":
          description: 长富Pro配置版本
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [activeConfigVersionId, versions]
                properties:
                  activeConfigVersionId: { type: ["string", "null"], format: uuid }
                  versions:
                    type: array
                    items:
                      $ref: "../schemas/official-model-config.schema.json"
  /api/v1/admin/official-model/versions:
    post:
      operationId: createOfficialModelDraft
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/official-model-config.schema.json#/$defs/createInput"
      responses:
        "201":
          description: 配置草稿已创建
          content:
            application/json:
              schema:
                $ref: "../schemas/official-model-config.schema.json"
  /api/v1/admin/official-model/versions/{versionId}:
    put:
      operationId: updateOfficialModelDraft
      parameters:
        - $ref: "#/components/parameters/VersionId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/official-model-config.schema.json#/$defs/updateInput"
      responses:
        "200":
          description: 配置草稿已更新
          content:
            application/json:
              schema:
                $ref: "../schemas/official-model-config.schema.json"
  /api/v1/admin/official-model/versions/{versionId}/{action}:
    post:
      operationId: operateOfficialModelVersion
      parameters:
        - $ref: "#/components/parameters/VersionId"
        - name: action
          in: path
          required: true
          schema: { enum: [test, activate, retire, rollback] }
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: 测试结果或状态更新结果
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: changfu_admin_session
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string, minLength: 32, maxLength: 256 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, pattern: "^[1-9][0-9]*$" }
    PlanCode:
      name: planCode
      in: path
      required: true
      schema: { enum: [LITE, PRO, FLAGSHIP] }
    VersionId:
      name: versionId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Updated:
      description: 操作已完成
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [updated]
            properties:
              updated: { const: true }
    Problem:
      description: 管理请求失败
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    PlanVersions:
      type: array
      items:
        $ref: "../schemas/admin-plan.schema.json"
    AdminSession:
      type: object
      additionalProperties: false
      required: [adminUserId, username, role, mustChangePassword]
      properties:
        adminUserId: { type: string, format: uuid }
        username: { type: string, minLength: 3, maxLength: 80 }
        role: { const: SUPER_ADMIN }
        mustChangePassword: { type: boolean }
    AdminLoginSession:
      allOf:
        - $ref: "#/components/schemas/AdminSession"
        - type: object
          required: [csrfToken, expiresAt]
          properties:
            csrfToken: { type: string, minLength: 32 }
            expiresAt: { type: string, format: date-time }
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, requestId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        code: { type: string, pattern: "^[A-Z0-9_]+$" }
        requestId: { type: string, format: uuid }
